name: Build and deploy website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Pick up documentation changes from the product repository without a commit here.
    - cron: '17 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # ./docs is a symlink to this checkout of the product repository's docs.
      # Read the fork this site is maintained against, so documentation edits here go live
      # without waiting on an upstream merge.
      - uses: actions/checkout@v5
        with:
          repository: nanzhaogang/sciencediscovery
          ref: main
          path: sciencediscovery
          sparse-checkout: docs
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # Reads the Pages site this repository deploys to, so the sitemap and robots.txt match it:
      # <owner>.github.io when the repository is an owner site, otherwise its project path. Only the
      # main-branch run deploys, and the Pages site has to exist already: enabling it needs a token
      # with administration/pages write, which GITHUB_TOKEN cannot provide.
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
